site_name: Summer Internship
site_description: Work instructions and self-check quiz for the internship program
site_url: https://stanc965.github.io/summer-internship/

theme:
  name: material
  palette:
    scheme: default
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting-started.md
      - Setup IAR Embedded Workbench: guide/setup-iar.md
      - New Project Tutorial with IAR: guide/new-project-iar.md
      - Logic Analyzer How To: guide/logic-analyzer.md
      - Git Workflow & Progress Tracking: guide/github-workflow-progress.md
      - Coding Rules: guide/coding-rules.md
  - Work Instructions:
      - Overview: work-instructions/index.md
      - "Week 1 · Goal 1": work-instructions/week1-goal1.md
      - "Week 1 · Goal 2": work-instructions/week1-goal2.md
      - "Week 2 · Goal 3": work-instructions/week2-goal1.md
      - "Week 2 · Goal 4": work-instructions/week2-goal2.md
      - "Week 3 · Goal 5": work-instructions/week3-goal1.md
      - "Week 3 · Goal 6": work-instructions/week3-goal2.md
      - "Week 3 · Goal 7": work-instructions/week3-goal3.md
  - Progress: work-instructions/progress.md
  - Quizzes:
      - Work Instructions Quiz: quiz/index.md
      - Results: quiz/results.md
      - Question Bank: quiz/data/work-instructions.md
  - Results: quiz/results.md
  - Reference Documents: reference-documents/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

extra_css:
  - assets/css/quiz.css

extra_javascript:
  - assets/js/quiz.js
