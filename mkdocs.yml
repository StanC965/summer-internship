site_name: Summer Internship
site_description: Work instructions and self-check quiz for the internship program
site_url: https://stanc965.github.io/summer-internship/

theme:
  name: material
  palette:
    scheme: default
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting-started.md
      - Setup IAR: guide/setup-iar.md
      - New Project Tutorial with IAR: guide/new-project-iar.md
      - Logic Analyzer: guide/logic-analyzer.md
      - Git Workflow & Progress Tracking: guide/github-workflow-progress.md
      - Coding Rules: guide/coding-rules.md
  - Work Instructions:
      - Overview: work-instructions/index.md
      - "Week 1 · Part 1": work-instructions/week1-part1.md
      - "Week 1 · Part 2": work-instructions/week1-part2.md
      - "Week 2 · Part 1": work-instructions/week2-part1.md
      - "Week 2 · Part 2": work-instructions/week2-part2.md
      - "Week 3 · Part 1": work-instructions/week3-part1.md
      - "Week 3 · Part 2": work-instructions/week3-part2.md
      - "Week 3 · Part 3": work-instructions/week3-part3.md
  - Progress:
  - Quizzes:
      - Work Instructions Quiz: quiz/index.md
      - Results: quiz/results.md
      - Question Bank: quiz/data/work-instructions.md
  - Results:
  - Reference Documents: reference-documents/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: material.extensions.emoji.twemoji
      emoji_generator: material.extensions.emoji.to_svg

extra_css:
  - assets/css/quiz.css

extra_javascript:
  - assets/js/quiz.js
